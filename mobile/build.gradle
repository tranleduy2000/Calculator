apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk = 37
    namespace = 'com.example.calc'

    defaultConfig {
        applicationId "com.xlythe.calculator.material"
        minSdk = 24
        targetSdk = 37
        versionCode = 93
        versionName = "5.4"
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
}

dependencies {
    implementation project(':basiccalculator-lib')
}

